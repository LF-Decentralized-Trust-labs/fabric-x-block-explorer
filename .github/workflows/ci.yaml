name: CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main, 'feat/**' ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write  # Required by golangci-lint-action v7+ for inline PR annotations
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34  # v5.3.0
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9.2.0
        with:
          version: v2.11.4

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34  # v5.3.0
        with:
          go-version: '1.26'

      - name: Start PostgreSQL
        run: make start-db

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          go test -race -tags db -coverprofile=coverage/coverage.out \
            $(go list ./pkg/... | grep -v '/integration')
          go tool cover -func=coverage/coverage.out

      - name: Check coverage threshold (≥ 60%)
        run: |
          go tool cover -func=coverage/coverage.out | \
            awk '/^total:/ { pct = $3+0; if (pct < 60) { printf "Coverage %.1f%% < 60%% threshold\n", pct; exit 1 } else { printf "✅ Coverage %.1f%%\n", pct } }'

      - name: Generate HTML coverage report
        run: go tool cover -html=coverage/coverage.out -o coverage/coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.html

  check-sqlc-generation:
    name: Validate SQLC Generated Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34  # v5.3.0
        with:
          go-version: '1.26'

      - name: Install sqlc
        run: |
          curl -sSfL -o sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.30.0/sqlc_1.30.0_linux_amd64.tar.gz
          echo "468aecee071bfe55e97fcbcac52ea0208eeca444f67736f3b8f0f3d6a106132e  sqlc.tar.gz" | sha256sum --check
          tar xzf sqlc.tar.gz
          sudo mv sqlc /usr/local/bin/
          sqlc version

      - name: Check generated SQLC code is up to date
        run: make check-sqlc

  ui-test:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: cd ui && npm ci --prefer-offline

      - name: Run UI tests
        run: cd ui && npm test

  ui-security:
    name: UI Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: cd ui && npm ci --prefer-offline

      - name: Run npm audit
        run: cd ui && npm audit --audit-level=critical

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34  # v5.3.0
        with:
          go-version: '1.26'

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Check committer test node image availability
        id: check_image
        run: |
          COMMITTER_VERSION=$(go list -m -f '{{.Version}}' github.com/hyperledger/fabric-x-committer)
          IMAGE="docker.io/hyperledger/committer-test-node:${COMMITTER_VERSION}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          if docker pull "${IMAGE}" 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "✅ Image available: ${IMAGE}"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  Image not yet published: ${IMAGE} — skipping integration tests"
          fi

      - name: Start PostgreSQL
        if: steps.check_image.outputs.available == 'true'
        run: make start-db

      - name: Run integration tests
        if: steps.check_image.outputs.available == 'true'
        run: make test-integration

  perf-smoke:
    name: Performance Smoke
    # Only run on push to main to keep PR CI fast.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34  # v5.3.0
        with:
          go-version: '1.26'

      - name: Install k6
        run: |
          sudo gpg -k
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Build binary
        run: make build

      - name: Start live stack
        run: bash scripts/test-live.sh --keep &
        env:
          CI: 'true'

      - name: Wait for REST API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && echo "✅ API ready" && break
            sleep 2
          done

      - name: Run smoke load test
        run: k6 run --env BASE_URL=http://127.0.0.1:18080 scripts/load-test/smoke.js

      - name: Stop live stack
        if: always()
        run: bash scripts/test-live.sh --down
