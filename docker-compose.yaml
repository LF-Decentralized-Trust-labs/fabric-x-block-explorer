#
# Production-ready stack: PostgreSQL (official image) + Explorer backend + UI.
# No source code required — all images are pulled from GHCR.
#
# Usage:
#   docker compose up -d
#
# The sidecar must be reachable on the host machine (default port 4001).
# See config.docker.yaml or set EXPLORER_SIDECAR_* env vars to customise.
#
# To build images locally from source instead of pulling from GHCR:
#   docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: fabric-explorer-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-explorer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  explorer:
    image: ghcr.io/lf-decentralized-trust-labs/fabric-x-block-explorer:latest
    # Uncomment to build locally from source instead:
    # build:
    #   context: .
    #   dockerfile: docker/images/release/Dockerfile
    container_name: fabric-explorer-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${EXPLORER_PORT:-8080}:8080"
    # Allows the explorer to reach a sidecar running on the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Mount config at runtime — not baked into the image.
    volumes:
      - ./config.docker.yaml:/home/explorer/config.docker.yaml:ro
    command: ["start", "--config", "/home/explorer/config.docker.yaml"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  ui:
    image: ghcr.io/lf-decentralized-trust-labs/fabric-x-block-explorer-ui:latest
    # Uncomment to build locally from source instead:
    # build:
    #   context: ./ui
    #   dockerfile: docker/images/ui/Dockerfile
    #   args:
    #     - BACKEND_URL=http://explorer:8080
    container_name: fabric-explorer-ui
    depends_on:
      explorer:
        condition: service_healthy
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      - BACKEND_URL=http://explorer:8080
      - NEXT_PUBLIC_BACKEND_DISPLAY_URL=${NEXT_PUBLIC_BACKEND_DISPLAY_URL:-http://localhost:8080}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
    driver: local
